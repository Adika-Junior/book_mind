# CI/CD: test -> build & scan image -> (tags only, with approval) rolling deploy to Kubernetes.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests (incl. Redis Streams / Redis KV backends)
        run: pytest -q
        env: { TEST_REDIS_URL: "redis://localhost:6379/0" }
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt -r requirements-otel.txt
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Frontend syntax check
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done
      - name: Text-structure tests (reflow, headings, no content lost)
        run: node --test "tests/js/*.test.mjs"
      - name: Palette contrast (WCAG) and generated CSS is up to date
        run: python tools/themes.py --check

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate manifests and fail if they drift from what is committed
        run: python deploy/k8s/generate.py && git diff --exit-code deploy/k8s
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD/rendered.yaml:/r.yaml:ro" ghcr.io/yannh/kubeconform:latest-alpine -strict -summary /r.yaml
      - name: Validate Prometheus rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v2.54.1 check rules /p/alerts.yml
      - name: Validate compose file
        run: |
          mkdir -p secrets && for f in auth_password internal_token redis_password grafana_password; do echo x > secrets/$f.txt; done
          touch secrets/tls.crt secrets/tls.key
          docker compose -f deploy/docker-compose.yml config -q

  image:
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bookmind
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/bookmind:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        if: github.event_name != 'pull_request'

  deploy:
    # Tags only, behind a GitHub "production" environment (add required reviewers there).
    # Rolling update with maxUnavailable: 0 + readiness probes => zero downtime; rollout status
    # fails the job (and `kubectl rollout undo` restores the last version) if pods never get ready.
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
      - name: Deploy
        env: { KUBECONFIG: "${{ runner.temp }}/kubeconfig" }
        run: |
          cd deploy/k8s
          kustomize edit set image ghcr.io/OWNER/bookmind=ghcr.io/${{ github.repository_owner }}/bookmind:${GITHUB_REF_NAME#v}
          kubectl apply -k .
          for d in catalog search research gateway; do kubectl -n bookmind rollout status deploy/$d --timeout=180s || { kubectl -n bookmind rollout undo deploy/$d; exit 1; }; done
          kubectl -n bookmind rollout status statefulset/notebook --timeout=180s
