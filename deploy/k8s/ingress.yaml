# Edge for Kubernetes: ingress-nginx does TLS (certificate from cert-manager / Let's Encrypt),
# ModSecurity + OWASP Core Rule Set (WAF), per-IP rate limits and body-size limits.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookmind
  namespace: bookmind
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "190"
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /metrics { deny all; }
      location = /readyz { deny all; }
      location /docs { deny all; }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [bookmind.example.org]
      secretName: bookmind-tls
  rules:
    - host: bookmind.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
