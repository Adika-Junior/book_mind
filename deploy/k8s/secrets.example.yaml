# NOT applied by kustomization.yaml — never commit real secrets. Choose one:
#
# 1) Quick start (values live only in your cluster):
#      kubectl -n bookmind create secret generic bookmind-secrets \
#        --from-literal=auth_password="$(openssl rand -base64 30)" \
#        --from-literal=internal_token="$(openssl rand -base64 30)" \
#        --from-literal=redis_password="$(openssl rand -base64 30)"
#
# 2) Recommended: sync from HashiCorp Vault / AWS Secrets Manager / GCP Secret Manager with the
#    External Secrets Operator. Rotation in the vault propagates to the mounted files; the
#    gateway re-reads its auth password on every request, so no restart is needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: bookmind-secrets, namespace: bookmind }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: bookmind-secrets }
  data:
    - { secretKey: auth_password,  remoteRef: { key: bookmind/prod, property: auth_password } }
    - { secretKey: internal_token, remoteRef: { key: bookmind/prod, property: internal_token } }
    - { secretKey: redis_password, remoteRef: { key: bookmind/prod, property: redis_password } }
