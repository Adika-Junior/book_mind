# For clusters running the Prometheus Operator (kube-prometheus-stack). Not applied by default.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: bookmind, namespace: bookmind }
spec:
  selector: { matchLabels: { app.kubernetes.io/part-of: bookmind } }
  podMetricsEndpoints: [{ port: http, path: /metrics, interval: 15s }]
