              "periodSeconds": 5,
              "failureThreshold": 2
            },
            "lifecycle": {
              "preStop": {
                "exec": {
                  "command": [
                    "python",
                    "-c",
                    "import time; time.sleep(5)"
                  ]
                }
              }
            },
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "runAsGroup": 10001,
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "secrets",
                "mountPath": "/run/secrets/bookmind",
                "readOnly": true
              },
              {
                "name": "flags",
                "mountPath": "/app/deploy/config",
                "readOnly": true
              },
              {
                "name": "voices",
                "mountPath": "/app/var/voices",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          },
          {
            "name": "secrets",
            "secret": {
              "secretName": "bookmind-secrets"
            }
          },
          {
            "name": "flags",
            "configMap": {
              "name": "bookmind-flags"
            }
          },
          {
            "name": "voices",
            "persistentVolumeClaim": {
              "claimName": "bookmind-voices",
              "readOnly": true
            }
          }
        ]
      }
    }
  }
}
