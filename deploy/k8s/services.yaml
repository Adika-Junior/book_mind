  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "websearch",
    "namespace": "bookmind",
    "labels": {
      "app.kubernetes.io/name": "websearch",
      "app.kubernetes.io/part-of": "bookmind"
    }
  },
  "spec": {
    "replicas": 2,
    "revisionHistoryLimit": 5,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "websearch"
      }
    },
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxUnavailable": 0,
        "maxSurge": 1
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "websearch",
          "app.kubernetes.io/part-of": "bookmind"
        },
        "annotations": {
          "prometheus.io/scrape": "true",
          "prometheus.io/port": "8000"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 30,
        "securityContext": {
          "fsGroup": 10001
        },
        "topologySpreadConstraints": [
          {
            "maxSkew": 1,
            "topologyKey": "kubernetes.io/hostname",
            "whenUnsatisfiable": "ScheduleAnyway",
            "labelSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "websearch"
              }
            }
          }
        ],
        "containers": [
          {
            "name": "websearch",
            "image": "ghcr.io/OWNER/bookmind:2.0.0",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "name": "http",
                "containerPort": 8000
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "bookmind-config"
                }
              }
            ],
            "env": [
              {
                "name": "SERVICE",
                "value": "websearch"
              },
              {
                "name": "BOOKMIND_INTERNAL_TOKEN_FILE",
                "value": "/run/secrets/bookmind/internal_token"
              },
              {
                "name": "BOOKMIND_REDIS_PASSWORD_FILE",
                "value": "/run/secrets/bookmind/redis_password"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "96Mi"
              },
              "limits": {
                "memory": "192Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "periodSeconds": 2,
              "failureThreshold": 30
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": "http"
              },
              "periodSeconds": 10,
              "failureThreshold": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/readyz",
                "port": "http"
              },
              "periodSeconds": 5,
              "failureThreshold": 2
            },
            "lifecycle": {
              "preStop": {
                "exec": {
                  "command": [
                    "python",
                    "-c",
                    "import time; time.sleep(5)"
                  ]
                }
              }
            },
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "runAsGroup": 10001,
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "secrets",
                "mountPath": "/run/secrets/bookmind",
                "readOnly": true
              },
              {
                "name": "flags",
                "mountPath": "/app/deploy/config",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          },
          {
            "name": "secrets",
            "secret": {
              "secretName": "bookmind-secrets"
            }
          },
          {
            "name": "flags",
            "configMap": {
              "name": "bookmind-flags"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "websearch",
    "namespace": "bookmind",
    "labels": {
      "app.kubernetes.io/name": "websearch",
      "app.kubernetes.io/part-of": "bookmind"
    }
  },
  "spec": {
    "selector": {
      "app.kubernetes.io/name": "websearch"
    },
    "ports": [
      {
        "name": "http",
        "port": 8000,
        "targetPort": "http"
      }
    ]
  }
}
---
{
  "apiVersion": "policy/v1",
  "kind": "PodDisruptionBudget",
  "metadata": {
    "name": "websearch",
    "namespace": "bookmind"
  },
  "spec": {
    "minAvailable": 1,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "websearch"
      }
    }
  }
}
