# BookMind edge proxy (blueprint §1): TLS termination, HTTP/2, L7 load balancing, edge caching,
# rate limiting, request filtering and JSON access logs. Sits in front of the API gateway.
# A CDN (Cloudflare / CloudFront) can sit in front of this; see docs/ARCHITECTURE.md §1.

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  default_type  application/octet-stream;
  server_tokens off;

  log_format json escape=json '{"ts":"$time_iso8601","service":"edge","remote":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,"upstream_s":"$upstream_response_time","upstream":"$upstream_addr",'
    '"cache":"$upstream_cache_status","traceparent":"$http_traceparent","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 64k;      # matches BOOKMIND_MAX_BODY_BYTES
  client_body_timeout 10s;       # slowloris protection
  client_header_timeout 10s;
  send_timeout 30s;

  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  # Per-client-IP limits (the gateway enforces its own, globally, via Redis).
  limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=research:10m rate=20r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Edge cache for the (large, immutable-per-release) book payload.
  proxy_cache_path /var/cache/nginx/book levels=1:2 keys_zone=book:10m max_size=200m inactive=1d use_temp_path=off;

  # Docker's embedded DNS; `resolve` re-resolves so scaled gateway replicas are all used.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream gateway {
    zone gateway 64k;
    server gateway:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  map $request_method $bad_method { default 1; ~^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$ 0; }

  server {
    listen 8080;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }  # published as 80->8080, 443->8443
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    limit_conn perip 40;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;            # trusted by the gateway (BOOKMIND_TRUST_PROXY)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;  # retried for idempotent methods only
    proxy_next_upstream_tries 2;

    # Lightweight request filtering. For full OWASP CRS inspection use the `waf` compose profile
    # (ModSecurity + Core Rule Set) or ingress-nginx's ModSecurity in Kubernetes.
    if ($bad_method) { return 405; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|sql|bak)$ { deny all; }

    # Internal endpoints never leave the cluster.
    location = /metrics { deny all; }
    location = /readyz  { deny all; }
    location /docs      { deny all; }
    location = /openapi.json { deny all; }

    location = /api/v1/research {
      limit_req zone=research burst=5 nodelay;
      proxy_read_timeout 190s;                         # local models can be slow on CPU
      proxy_pass http://gateway;
    }

    location = /api/v1/book {
      limit_req zone=api burst=60 nodelay;
      proxy_cache book;
      proxy_cache_key "$scheme$host$request_uri$http_authorization";  # never serve across auth boundaries
      proxy_cache_valid 200 5m;
      # The gateway says "no-cache" so *browsers* always revalidate by ETag; the edge may still
      # hold it for 5 minutes (it answers If-None-Match with 304 from its own copy).
      proxy_ignore_headers Cache-Control Expires;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      add_header X-Edge-Cache $upstream_cache_status always;
      add_header Strict-Transport-Security "max-age=63072000" always;
      proxy_pass http://gateway;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://gateway;
    }

    location / {
      proxy_pass http://gateway;
    }
  }
}
