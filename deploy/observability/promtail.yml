# Ships every container's stdout (already one JSON object per line) to Loki, lifting the fields
# you filter on into labels and keeping trace_id searchable.
server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: http://loki:3100/loki/api/v1/push }]
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters: [{ name: label, values: ["com.docker.compose.project=bookmind"] }]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Ship the app's logs, not the monitoring stack's own chatter.
      - source_labels: [compose_service]
        regex: (loki|promtail|grafana|prometheus|alertmanager|jaeger)
        action: drop
    pipeline_stages:
      - json:
          expressions: { level: level, service: service, trace_id: trace_id, route: route }
      - labels: { level: "", service: "" }
      - structured_metadata: { trace_id: "" }
